<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1424" />
  <meta name="description" content="A playable low-poly 3D cricket game: build a 15-player squad, pick a legal XI and play a limited-overs match against the computer with keyboard or a game controller." />
  <title>Low-Poly Cricket</title>
  <!-- Link previews (WhatsApp, Slack, X, …). Update the URLs if the game moves to another address. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Low-Poly Cricket" />
  <meta property="og:description" content="Play a limited-overs cricket match in your browser: build your squad, bat, bowl and chase a target. Keyboard or game controller." />
  <meta property="og:url" content="https://abhi0303.github.io/cricket-game/" />
  <meta property="og:image" content="https://abhi0303.github.io/cricket-game/assets/preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%23c1121f%22/%3E%3Cpath d=%22M9 7q7 9 0 18M23 7q-7 9 0 18%22 stroke=%22%23fff%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game" aria-label="3D cricket stadium"></canvas>
  <div id="ui" class="ui"></div>
  <div id="hud" class="hud hidden"></div>
  <div id="overlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="pad-indicator" class="pad-indicator hidden" title="Controller connected"></div>
  <div id="boot" class="boot">
    <div class="boot-logo">LOW<span>-</span>POLY <b>CRICKET</b></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-msg">Preparing the pitch…</div>
  </div>
  <noscript>This game needs JavaScript enabled.</noscript>
  <script>
    // If the modules can't load (offline CDN, opened from file://), say so instead of spinning forever.
    setTimeout(function () {
      var b = document.getElementById('boot');
      if (!b) return;
      var m = b.querySelector('.boot-msg');
      m.innerHTML = location.protocol === 'file:'
        ? 'Please run the game through a local web server (see README): <code>python3 -m http.server 8000</code>'
        : 'Still loading… Three.js is loaded from the jsDelivr CDN, so an internet connection is needed.';
    }, 12000);
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
