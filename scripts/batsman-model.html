<!doctype html>
<!--
  Batsman model builder. Turns the downloaded Sketchfab model in models-src/batsman ("Virat Kohli Cricket Batting
  Animation - Low Poly" by bhagathartworks, CC-BY-4.0: a Mixamo-rigged low-poly body) into what the game loads:
    assets/models/batsman/batsman.glb   the skinned body in its bind pose, no animations and no bat
    assets/models/batsman/body.jpg      its texture at 1024 x 1024
  The game drives the skeleton from its own animation (src/scene/RiggedBody.js). Open from a local server at the repo root.
-->
<meta charset="utf-8">
<title>Batsman model</title>
<style>body { background: #1c1f24; color: #cfd6e0; font: 14px system-ui, sans-serif; margin: 12px; } canvas { width: 600px; height: 600px; }</style>
<p id="info">Building…</p>
<canvas id="view" width="1200" height="1200"></canvas>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const SRC = '/models-src/batsman/scene.gltf', TEX = 1024;
const g = await new GLTFLoader().loadAsync(SRC);
const scene = g.scene;
let body = null;
const drop = [];
scene.traverse(o => { if (o.isSkinnedMesh) body = o; else if (o.isMesh) drop.push(o); });
for (const o of drop) o.parent.remove(o);                   // the bat: the game gives him its own
body.skeleton.pose();                                       // the bind pose, not the first frame of the animation
scene.updateMatrixWorld(true);

// texture out as a JPEG; the exported material carries none (the game sets it)
const img = body.material.map.image;
const c = document.createElement('canvas'); c.width = c.height = TEX;
c.getContext('2d').drawImage(img, 0, 0, TEX, TEX);
const jpg = c.toDataURL('image/jpeg', 0.88);
const map = body.material.map;
body.material = new THREE.MeshStandardMaterial({ name: 'body', roughness: 0.9 });

const glb = await new GLTFExporter().parseAsync(scene, { binary: true, animations: [] });
const b64 = btoa(Array.from(new Uint8Array(glb), ch => String.fromCharCode(ch)).join(''));

// preview of the bind pose
body.material = new THREE.MeshStandardMaterial({ map, roughness: 0.9 });
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true });
r.outputColorSpace = THREE.SRGBColorSpace;
const show = new THREE.Scene(); show.background = new THREE.Color('#dddddd');
show.add(new THREE.HemisphereLight('#fff', '#777', 2)); const sun = new THREE.DirectionalLight('#fff', 2); sun.position.set(2, 4, 5); show.add(sun);
show.add(scene);
const box = new THREE.Box3().setFromObject(scene), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100); cam.position.copy(mid).add(new THREE.Vector3(0, 0, Math.max(size.x, size.y) * 2.2)); cam.lookAt(mid);
r.render(show, cam);
const stats = { bones: body.skeleton.bones.length, tris: body.geometry.index ? body.geometry.index.count / 3 : body.geometry.attributes.position.count / 3, size: size.toArray().map(v => +v.toFixed(3)), glbKB: Math.round(glb.byteLength / 1024) };
document.getElementById('info').textContent = JSON.stringify(stats);
window.__batsman = { glb: b64, jpg, stats, done: true };
</script>
