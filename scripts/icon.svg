    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1c3566"/><stop offset="1" stop-color="#070d18"/></radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ff5a4e"/><stop offset="0.55" stop-color="#c1121f"/><stop offset="1" stop-color="#6d0a12"/></radialGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3dfaa"/><stop offset="1" stop-color="#d4b06a"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) rotate(-38)">
    <rect x="-34" y="-196" width="68" height="250" rx="22" fill="url(#bat)" stroke="#8a6a2a" stroke-width="5"/>
    <rect x="-13" y="-262" width="26" height="74" rx="10" fill="#1f6b3a" stroke="#0d3b1f" stroke-width="4"/>
  </g>
  <circle cx="312" cy="318" r="104" fill="url(#ball)" stroke="#4a060c" stroke-width="5"/>
  <path d="M243 247 C 300 290, 330 340, 352 410" fill="none" stroke="#fff5e1" stroke-width="7" stroke-dasharray="11 9"/>
  <path d="M262 231 C 322 274, 352 330, 377 398" fill="none" stroke="#fff5e1" stroke-width="7" stroke-dasharray="11 9"/>
  <ellipse cx="282" cy="276" rx="28" ry="16" fill="#ffffff" opacity="0.22" transform="rotate(-35 282 276)"/>
