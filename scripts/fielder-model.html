<!doctype html>
<!--
  Fielder model builder. Turns the downloaded "indian male character" by Aashutosh Dabhade (CC-BY-4.0; a Ready Player
  Me avatar on a Mixamo-style skeleton; models-src/fielder) into what the game loads:
    assets/models/fielder/fielder.glb   the skinned body in its bind pose, no textures
    assets/models/fielder/base.jpg      its colour map at 1024 x 1024, with the shirt's lettering, logo and number
                                        painted out (the game recolours the kit to each team's)
    assets/models/fielder/normal.jpg    its normal map
  Open from a local server at the repo root.
-->
<meta charset="utf-8">
<title>Fielder model</title>
<style>body { background: #1c1f24; color: #cfd6e0; font: 14px system-ui, sans-serif; margin: 12px; } canvas { width: 512px; height: 512px; margin-right: 8px; }</style>
<p id="info">Building…</p>
<canvas id="tex" width="1024" height="1024"></canvas><canvas id="view" width="1024" height="1024"></canvas>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const SRC = '/models-src/fielder/scene.gltf', TEX = 1024;
// Lettering on the shirt to paint out, in texture pixels (1024 x 1024): the chest logo and "INDIA", and the number
// on the back. Each box is refilled from the shirt just outside it, blending all four sides (a Coons patch), so
// the folds and shading carry across.
const ERASE = [[78, 92, 112, 136], [86, 150, 213, 203], [354, 78, 474, 240]];

const g = await new GLTFLoader().loadAsync(SRC);
const scene = g.scene;
let body = null;
scene.traverse(o => { if (o.isSkinnedMesh) body = o; });
scene.updateMatrixWorld(true);
body.skeleton.pose();
scene.updateMatrixWorld(true);
for (const n of ['tangent', 'uv1']) body.geometry.deleteAttribute(n);

// colour map with the lettering painted out
const c = document.getElementById('tex'), ctx = c.getContext('2d');
ctx.drawImage(body.material.map.image, 0, 0, TEX, TEX);
const img = ctx.getImageData(0, 0, TEX, TEX), d = img.data, src = d.slice();
const at = (x, y, k) => src[(y * TEX + x) * 4 + k];
for (const [x0, y0, x1, y1] of ERASE) {
  const l = x0 - 3, r = x1 + 3, t = y0 - 3, b = y1 + 3;
  for (let y = y0; y <= y1; y++) {
    const v = (y - t) / (b - t);
    for (let x = x0; x <= x1; x++) {
      const u = (x - l) / (r - l), o = (y * TEX + x) * 4;
      for (let k = 0; k < 3; k++) {
        const side = (1 - u) * at(l, y, k) + u * at(r, y, k), edge = (1 - v) * at(x, t, k) + v * at(x, b, k);
        const corner = (1 - u) * (1 - v) * at(l, t, k) + u * (1 - v) * at(r, t, k) + (1 - u) * v * at(l, b, k) + u * v * at(r, b, k);
        d[o + k] = side + edge - corner;
      }
    }
  }
}
ctx.putImageData(img, 0, 0);
const base = c.toDataURL('image/jpeg', 0.88);
const n = document.createElement('canvas'); n.width = n.height = TEX;
n.getContext('2d').drawImage(body.material.normalMap.image, 0, 0, TEX, TEX);
const normal = n.toDataURL('image/jpeg', 0.9);

const keep = body.material;
body.material = new THREE.MeshStandardMaterial({ name: 'fielder', roughness: 0.7 });
const glb = await new GLTFExporter().parseAsync(scene, { binary: true, animations: [] });
const b64 = btoa(Array.from(new Uint8Array(glb), ch => String.fromCharCode(ch)).join(''));

// preview: the bind pose with the cleaned shirt
const map = new THREE.CanvasTexture(c); map.colorSpace = THREE.SRGBColorSpace; map.flipY = false;
body.material = new THREE.MeshStandardMaterial({ map, normalMap: keep.normalMap, roughness: 0.7 });
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: true });
r.outputColorSpace = THREE.SRGBColorSpace;
const show = new THREE.Scene(); show.background = new THREE.Color('#dddddd');
show.add(new THREE.HemisphereLight('#fff', '#777', 2)); const sun = new THREE.DirectionalLight('#fff', 2); sun.position.set(2, 4, 5); show.add(sun);
show.add(scene);
const box = new THREE.Box3().setFromObject(scene), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
r.setScissorTest(true);
[[0, 0, 1], [0, 0, -1]].forEach((v, i) => {
  cam.aspect = 0.5; cam.updateProjectionMatrix();
  cam.position.copy(mid).add(new THREE.Vector3(...v).multiplyScalar(size.y * 2.3)); cam.lookAt(mid);
  r.setViewport(i * 512, 0, 512, 1024); r.setScissor(i * 512, 0, 512, 1024); r.render(show, cam);
});
const stats = { bones: body.skeleton.bones.length, verts: body.geometry.attributes.position.count, size: size.toArray().map(v => +v.toFixed(3)), glbKB: Math.round(glb.byteLength / 1024) };
document.getElementById('info').textContent = JSON.stringify(stats);
window.__fielder = { glb: b64, base, normal, stats, done: true };
</script>
