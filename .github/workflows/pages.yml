# Publishes the game to GitHub Pages on every push to main (or by hand from the Actions tab).
# The tests run first; a failing test stops the deploy. Only the files the game needs are published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir _site
          cp -R index.html manifest.webmanifest sw.js css src assets _site/
          touch _site/.nojekyll
          # the offline app (sw.js): the files to save on install, and a version so a new publish replaces the old copy
          (cd _site && find index.html manifest.webmanifest css src assets -type f ! -name '*.txt' ! -name '.DS_Store' | sort | python3 -c 'import sys, json; print(json.dumps(["./" + l.strip() for l in sys.stdin]))' > precache.json)
          sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -n "^const VERSION" _site/sw.js
          echo "Published files:" && find _site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
